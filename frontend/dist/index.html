<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPT-Web AI演示文稿生成</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--accent:#3b82f6;--accent2:#8b5cf6;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:20px}
h1{text-align:center;font-size:1.6em;margin-bottom:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:1.1em;margin-bottom:12px;color:var(--accent)}
label{display:block;font-size:.85em;color:var(--dim);margin-bottom:4px;margin-top:10px}
input,textarea,select{width:100%;background:#0f172a;border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:.9em;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:100px;font-family:inherit}
.row{display:flex;gap:12px;align-items:center}
.row>*{flex:1}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:.95em;cursor:pointer;transition:all .2s;font-weight:600}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#475569}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover{opacity:.9}

/* Tab */
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab-btn{padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--dim);cursor:pointer;font-size:.85em;transition:all .2s}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 进度 */
.progress-wrap{margin:16px 0}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s;border-radius:4px}
.progress-text{font-size:.85em;color:var(--dim);margin-top:6px}
.stage-text{font-size:.9em;color:var(--text);margin-top:4px}

/* ══ Eight Confirmations 卡片 ══ */
.cf-card{background:#0f172a;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;transition:border-color .2s}
.cf-card:hover{border-color:#475569}
.cf-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cf-title{font-weight:700;font-size:.95em;display:flex;align-items:center;gap:8px}
.cf-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:700;flex:none}
.cf-status{font-size:.75em;padding:2px 8px;border-radius:4px;background:rgba(59,130,246,.15);color:var(--accent)}
.cf-status.modified{background:rgba(245,158,11,.15);color:var(--warn)}
.cf-body{display:flex;flex-direction:column;gap:8px}
.cf-row{display:flex;gap:10px;align-items:center}
.cf-row>label{margin:0;min-width:70px;font-size:.8em;flex:none}
.cf-row>input,.cf-row>select{flex:1}
.cb-wrap>input{flex:1}
.cb-dropdown{display:none;position:absolute;left:80px;right:0;top:100%;z-index:100;background:#1e293b;border:1px solid var(--border);border-radius:6px;max-height:220px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.cb-opt{padding:8px 12px;cursor:pointer;font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-opt:hover{background:rgba(59,130,246,.2)}

/* 颜色选择 */
.color-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.color-item{display:flex;align-items:center;gap:4px}
.color-item input[type=color]{width:32px;height:32px;border:2px solid var(--border);border-radius:6px;cursor:pointer;padding:0;background:none}
.color-item input[type=text]{width:80px;font-size:.8em;padding:4px 8px}
.color-item span{font-size:.75em;color:var(--dim);min-width:40px}

/* Page plan */
.page-list{margin-top:12px}
.page-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;background:#0f172a}
.page-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;flex:none}
.page-info{flex:1;font-size:.85em}
.page-info .page-title{font-weight:600}
.page-info .page-hint{color:var(--dim);font-size:.8em}

/* 拖拽 */
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:all .2s;color:var(--dim)}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:rgba(59,130,246,.05)}
.drop-zone input{display:none}

.hidden{display:none!important}

.result-box{text-align:center;padding:20px}
.result-box .download-btn{display:inline-block;margin-top:16px;padding:14px 32px;font-size:1.1em}
.result-box .preview-link{display:inline-block;margin-top:12px;color:var(--accent);text-decoration:underline}

/* 确认区域 */
.confirm-footer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:16px 0;text-align:center;display:flex;gap:12px;justify-content:center;margin-top:8px}
</style>
</head>
<body>
<div class="container">
<h1>🎨 PPT-Web AI演示文稿生成</h1>

<!-- ══════ 阶段1: 输入 ══════ -->
<div id="phase-input">
  <div class="card">
    <h2>📝 内容输入</h2>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('text')">✏️ 粘贴文本</button>
      <button class="tab-btn" onclick="switchTab('file')">📎 上传文档</button>
    </div>
    <div id="tab-text">
      <textarea id="sourceText" placeholder="请粘贴要生成PPT的文本内容..."></textarea>
    </div>
    <div id="tab-file" class="hidden">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p>📄 点击或拖拽文件到此处</p>
        <p style="font-size:.8em;margin-top:6px">支持 .md .txt .docx .pdf</p>
        <input type="file" id="fileInput" accept=".md,.txt,.docx,.pdf">
      </div>
      <div id="fileInfo" class="hidden" style="margin-top:10px;font-size:.85em;color:var(--ok)"></div>
      <input type="hidden" id="sourceContent" value="">
    </div>
  </div>

  <div class="card">
    <h2>⚙️ 生成设置</h2>
    <div class="row">
      <div>
        <label>PPT主题</label>
        <input type="text" id="topicInput" placeholder="例: 2024年度工作总结">
      </div>
      <div>
        <label>画布格式</label>
        <select id="formatSelect">
          <option value="ppt169">PPT 16:9 (宽屏)</option>
          <option value="ppt43">PPT 4:3 (标准)</option>
        </select>
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:6px;margin-top:12px;cursor:pointer">
      <input type="checkbox" id="thinkingCheck" style="width:auto"> 🧠 启用深度思考模式(耗时更长, 质量更好)
    </label>
  </div>

  <div style="text-align:center">
    <button class="btn btn-primary" onclick="startPreview()" id="previewBtn">🚀 生成设计方案</button>
  </div>
</div>

<!-- ══════ 阶段2: 八项确认 ══════ -->
<div id="phase-confirm" class="hidden">
  <div class="card">
    <h2>📋 Step 4: Eight Confirmations（八项确认）</h2>
    <p style="font-size:.85em;color:var(--dim);margin-bottom:16px">
      AI 已根据您的内容生成设计方案。请审阅以下 8 项，可直接修改，然后点击底部按钮确认生成。
    </p>
    <div id="cfContainer"><!-- JS 动态填充 --></div>
  </div>

  <div class="card">
    <h2>📄 页面规划预览</h2>
    <p style="font-size:.85em;color:var(--dim);margin-bottom:8px">共 <span id="pageCount">0</span> 页（确认后将按此规划生成）</p>
    <div class="page-list" id="pageList"></div>
  </div>

  <div class="confirm-footer">
    <button class="btn btn-secondary" onclick="goBackToInput()">← 返回修改内容</button>
    <button class="btn btn-ok" onclick="confirmAndExecute()" style="font-size:1.05em;padding:12px 32px">✅ 确认方案，开始生成 PPT</button>
  </div>
</div>

<!-- ══════ 阶段3: 进度 ══════ -->
<div id="phase-progress" class="hidden">
  <div class="card">
    <h2 id="progressTitle">⏳ 正在生成PPT...</h2>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:5%"></div></div>
      <div class="progress-text" id="progressPct">5%</div>
    </div>
    <div class="stage-text" id="progressStage"></div>
    <div class="stage-text" id="progressMsg" style="color:var(--dim)"></div>
  </div>
</div>

<!-- ══════ 阶段4: 完成 ══════ -->
<div id="phase-done" class="hidden">
  <div class="card">
    <div class="result-box">
      <div style="font-size:3em">🎉</div>
      <h2 style="margin-top:12px;color:var(--ok)">PPT 生成完成!</h2>
      <a class="btn btn-primary download-btn" id="downloadBtn" href="#">📥 下载 PPTX 文件</a><br>
      <a class="preview-link" id="previewLink" href="#" target="_blank">🔍 在线预览 SVG</a>
    </div>
  </div>
</div>

<!-- ══════ 错误 ══════ -->
<div id="phase-error" class="hidden">
  <div class="card">
    <div class="result-box">
      <div style="font-size:3em">❌</div>
      <h2 style="margin-top:12px;color:var(--err)">生成失败</h2>
      <p id="errorMsg" style="margin-top:10px;color:var(--dim);font-size:.9em;word-break:break-all"></p>
      <button class="btn btn-secondary" style="margin-top:16px" onclick="resetAll()">重新开始</button>
    </div>
  </div>
</div>
</div><!-- /container -->

<script>
// ── 状态 ──
let currentTab = 'text';
let currentTaskId = null;
let previewData = null;
let thinkingPref = localStorage.getItem('ppt_thinking') === 'true';

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('thinkingCheck').checked = thinkingPref;
  document.getElementById('thinkingCheck').addEventListener('change', e => {
    thinkingPref = e.target.checked;
    localStorage.setItem('ppt_thinking', thinkingPref);
  });
  const dz = document.getElementById('dropZone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); if(e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]); });
  document.getElementById('fileInput').addEventListener('change', e => { if(e.target.files.length) uploadFile(e.target.files[0]); });
});

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-text').classList.toggle('hidden', tab !== 'text');
  document.getElementById('tab-file').classList.toggle('hidden', tab !== 'file');
}

async function uploadFile(file) {
  const fd = new FormData(); fd.append('file', file);
  try {
    document.getElementById('fileInfo').classList.remove('hidden');
    document.getElementById('fileInfo').textContent = '⏳ 正在解析...';
    const r = await fetch('/api/upload', {method:'POST', body:fd});
    if(!r.ok){const e=await r.json();throw new Error(e.detail||'上传失败');}
    const data = await r.json();
    document.getElementById('sourceContent').value = data.text;
    document.getElementById('fileInfo').innerHTML = '✅ ' + data.filename + ' (' + data.char_count + ' 字)';
    if(!document.getElementById('topicInput').value) document.getElementById('topicInput').value = file.name.replace(/\.[^.]+$/,'');
  } catch(e) {
    document.getElementById('fileInfo').innerHTML = '<span style="color:var(--err)">❌ '+e.message+'</span>';
  }
}

// ── 阶段切换 ──
function showPhase(p) { ['input','confirm','progress','done','error'].forEach(x => document.getElementById('phase-'+x).classList.toggle('hidden', x!==p)); }
function goBackToInput() { showPhase('input'); }
function resetAll() { currentTaskId=null; previewData=null; showPhase('input'); }

// ── Step 1-4: 生成预览 ──
async function startPreview() {
  let src = currentTab==='text' ? document.getElementById('sourceText').value.trim() : document.getElementById('sourceContent').value.trim();
  const topic = document.getElementById('topicInput').value.trim();
  if(!src){alert('请输入或上传内容');return;}
  if(!topic){alert('请填写PPT主题');return;}

  showPhase('progress');
  document.getElementById('progressTitle').textContent='⏳ Step 1-4: 正在生成设计方案...';
  updateProgressUI({progress:5,stage:'init',message:'创建项目中...'});

  try {
    const r = await fetch('/api/generate/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      source_text:src, topic:topic, format:document.getElementById('formatSelect').value, enable_thinking:thinkingPref
    })});
    if(!r.ok){const e=await r.json();throw new Error(e.detail||'请求失败');}
    const d=await r.json();
    currentTaskId=d.task_id;
    connectWS(currentTaskId);
    pollUntil(currentTaskId,'awaiting_confirm', onPreviewDone, onError);
  } catch(e) { showError(e.message); }
}

function onPreviewDone(task) {
  previewData = task.preview_data;
  renderConfirmations(previewData.eight_confirmations);
  renderPagePlan(previewData.page_plan);
  showPhase('confirm');
}

// ══════════════════════════════════════════════════════════
//  渲染 Eight Confirmations — 每项都是可编辑的卡片
// ══════════════════════════════════════════════════════════

function renderConfirmations(cf) {
  if(!cf || typeof cf!=='object') cf={};
  const c = document.getElementById('cfContainer');
  c.innerHTML = '';

  // 1. 画布格式
  addCard(c, 1, '画布格式', [
    {label:'格式', key:'canvas_format', type:'select', value: cf.canvas_format||'PPT 16:9 (1280×720)',
     options:['PPT 16:9 (1280×720)','PPT 4:3 (960×720)','XHS 3:4 (1080×1440)']}
  ]);

  // 2. 页数设置
  const pc = cf.page_count||{};
  addCard(c, 2, '页数设置', [
    {label:'页数', key:'page_count.recommended', type:'number', value: pc.recommended||8, min:3, max:30, onchange:'adjustPagePlan()'}
  ]);

  // 3. 目标受众
  addCard(c, 3, '目标受众', [
    {label:'描述', key:'target_audience', type:'combobox', value: cf.target_audience||'', placeholder:'描述PPT的目标受众',
     options:['领导/高管','内部团队','外部客户/合作伙伴','培训学员','行业专家','公众/社会大众','投资方','上级主管部门','同级同事','跨部门协作方']}
  ]);

  // 4. 风格目标 — Layer1模式选择 + Layer2自由描述
  addCard(c, 4, '风格目标', [
    {label:'沟通模式', key:'style_objective.mode', type:'combobox', value: (cf.style_objective||'').match(/^[A-C]\)/)?cf.style_objective.split('—')[0].trim():'', placeholder:'选择沟通模式',
     options:['A) General Versatile — 视觉冲击优先','B) General Consulting — 数据清晰优先','C) Top Consulting — 逻辑说服优先']},
    {label:'视觉风格描述', key:'style_objective.style', type:'combobox', value: (cf.style_objective||'').includes('—')?cf.style_objective.split('—').slice(1).join('—').trim():cf.style_objective||'', placeholder:'描述期望的视觉风格',
     options:['neo-Chinese (新中式)','corporate-photo (商务摄影)','flat (扁平化)','editorial (编辑排版)','vivid-launch (炫酷发布会)','digital-dashboard (数据面板)','sketch-notes (手绘笔记)','vector-illustration (矢量插画)','screen-print (丝网印刷)','ink-notes (水墨笔记)','warm-earth (暖色调大地系)','cool-corporate (冷色调商务系)']}
  ]);

  // 5. 配色方案
  const cs = cf.color_scheme||{};
  const colors = [];
  ['primary','secondary','accent','background','text'].forEach(k => {
    if(cs[k]) colors.push({label:k, key:'color_scheme.'+k, value:cs[k]});
  });
  if(colors.length) {
    addCard(c, 5, '配色方案', [
      {label:'调色板', key:'_colors', type:'colors', colors: colors},
      {label:'说明', key:'color_scheme.description', type:'text', value: cs.description||'', placeholder:'配色方案说明'}
    ]);
  } else {
    addCard(c, 5, '配色方案', [
      {label:'说明', key:'color_scheme.description', type:'textarea', value: cs.description||'', placeholder:'请描述配色方案'}
    ]);
  }

  // 6. 图标使用策略
  addCard(c, 6, '图标使用策略', [
    {label:'图标来源', key:'icon_usage', type:'combobox', value: cf.icon_usage||'', placeholder:'选择图标使用策略',
     options:['A) Emoji — 休闲、活泼、社交媒体','B) AI-generated — 需要定制风格','C) Built-in icon library — 专业场景(推荐)','D) Custom icons — 已有品牌图标']}
  ]);

  // 7. 字体方案
  const tp = cf.typography||{};
  addCard(c, 7, '字体方案', [
    {label:'标题字体', key:'typography.heading_font', type:'combobox', value: tp.heading_font||'', placeholder:'选择或输入标题字体',
     options:['Microsoft YaHei, PingFang SC, sans-serif','SimHei, Heiti SC, sans-serif','KaiTi, Georgia, serif','FangSong, Times New Roman, serif','Arial, Microsoft YaHei, sans-serif','Georgia, KaiTi, serif','Palatino, FangSong, serif','Impact, Arial Black, SimHei, sans-serif','Cambria, SimSun, serif']},
    {label:'标题字号', key:'typography.heading_size', type:'combobox', value: tp.heading_size||'', placeholder:'例: 32-40px',
     options:['28-36px','32-40px','36-44px','40-48px']},
    {label:'正文字体', key:'typography.body_font', type:'combobox', value: tp.body_font||'', placeholder:'选择或输入正文字体',
     options:['Microsoft YaHei, PingFang SC, sans-serif','SimHei, Heiti SC, sans-serif','SimSun, serif','Arial, Microsoft YaHei, sans-serif','Cambria, SimSun, serif','Times New Roman, SimSun, serif']},
    {label:'正文字号', key:'typography.body_size', type:'combobox', value: tp.body_size||'', placeholder:'例: 18-22px',
     options:['14-18px','16-20px','18-22px','20-24px']},
    {label:'说明', key:'typography.description', type:'text', value: tp.description||'', placeholder:'字体方案说明'}
  ]);

  // 8. 图片使用策略
  addCard(c, 8, '图片使用策略', [
    {label:'图片来源', key:'image_usage', type:'combobox', value: cf.image_usage||'', placeholder:'选择图片使用策略',
     options:['A) No images — 数据报告、流程文档','B) User-provided — 已有图片素材','C) AI-generated — 定制插画/背景','D) Web-sourced — 真实参考图/图库','E) Placeholders — 后续添加图片']}
  ]);
}

function addCard(container, num, title, fields) {
  const div = document.createElement('div');
  div.className = 'cf-card';
  let html = `<div class="cf-header">
    <div class="cf-title"><span class="cf-num">${num}</span> ${title}</div>
    <div class="cf-status" id="cf-status-${num}">AI 推荐</div>
  </div><div class="cf-body">`;

  fields.forEach(f => {
    if(f.type === 'select') {
      html += `<div class="cf-row"><label>${f.label}</label><select data-cf="${f.key}" onchange="markModified(${num})">`;
      f.options.forEach(o => { html += `<option value="${o}" ${o===f.value?'selected':''}>${o}</option>`; });
      html += '</select></div>';
    } else if(f.type === 'combobox') {
      const cbId = 'cb_' + f.key.replace(/[^a-zA-Z0-9]/g,'_');
      html += `<div class="cf-row cb-wrap" style="position:relative"><label>${f.label}</label>`;
      html += `<input type="text" data-cf="${f.key}" id="${cbId}" value="${escHtml(f.value)}" placeholder="${f.placeholder||''}" oninput="markModified(${num});_cbFilter(this)" onfocus="_cbShowAll(this)" autocomplete="off">`;
      html += `<div class="cb-dropdown" id="${cbId}_dd">`;
      (f.options||[]).forEach(o => { html += `<div class="cb-opt" onmousedown="_cbSelect(event,'${cbId}',this)" data-val="${escHtml(o)}">${escHtml(o)}</div>`; });
      html += '</div></div>';
    } else if(f.type === 'number') {
      html += `<div class="cf-row"><label>${f.label}</label><input type="number" data-cf="${f.key}" value="${f.value}" min="${f.min||1}" max="${f.max||99}" onchange="markModified(${num});${f.onchange||''}"></div>`;
    } else if(f.type === 'text') {
      html += `<div class="cf-row"><label>${f.label}</label><input type="text" data-cf="${f.key}" value="${escHtml(f.value)}" placeholder="${f.placeholder||''}" oninput="markModified(${num})"></div>`;
    } else if(f.type === 'textarea') {
      html += `<div class="cf-row"><label>${f.label}</label><textarea data-cf="${f.key}" placeholder="${f.placeholder||''}" oninput="markModified(${num})">${escHtml(f.value)}</textarea></div>`;
    } else if(f.type === 'colors') {
      html += '<div class="color-row">';
      f.colors.forEach(c => {
        html += `<div class="color-item">
          <span>${c.label}</span>
          <input type="color" value="${c.value}" onchange="this.nextElementSibling.value=this.value;markModified(${num})">
          <input type="text" data-cf="${c.key}" value="${c.value}" oninput="this.previousElementSibling.value=this.value;markModified(${num})">
        </div>`;
      });
      html += '</div>';
    }
  });

  html += '</div>';
  div.innerHTML = html;
  container.appendChild(div);
}

function markModified(num) {
  const el = document.getElementById('cf-status-' + num);
  if(el) { el.textContent = '已修改'; el.className = 'cf-status modified'; }
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ── 自定义 Combobox (替代 datalist, 始终显示全部选项) ──
function _cbShowAll(input) {
  // 聚焦时关闭其他下拉，展示全部选项
  document.querySelectorAll('.cb-dropdown').forEach(d => d.style.display='none');
  const dd = document.getElementById(input.id + '_dd');
  if(!dd) return;
  dd.querySelectorAll('.cb-opt').forEach(opt => opt.style.display='');
  dd.style.display = 'block';
  // 点击外部关闭
  setTimeout(() => document.addEventListener('mousedown', _cbCloseOutside, {once:false}), 0);
}
function _cbCloseOutside(e) {
  // 如果点击不在 combobox 内部，关闭所有下拉
  if(!e.target.closest('.cb-wrap')) {
    document.querySelectorAll('.cb-dropdown').forEach(d => d.style.display='none');
  }
  // 只在下拉可见时继续监听
  const anyOpen = [...document.querySelectorAll('.cb-dropdown')].some(d => d.style.display==='block');
  if(anyOpen) document.addEventListener('mousedown', _cbCloseOutside, {once:false});
}
function _cbFilter(input) {
  const dd = document.getElementById(input.id + '_dd');
  if(!dd) return;
  const val = input.value.toLowerCase();
  dd.querySelectorAll('.cb-opt').forEach(opt => {
    opt.style.display = (!val || opt.dataset.val.toLowerCase().includes(val)) ? '' : 'none';
  });
  dd.style.display = 'block';
  document.addEventListener('mousedown', _cbCloseOutside, {once:false});
}
function _cbSelect(e, inputId, opt) {
  e.preventDefault(); // 阻止 blur 导致的关闭
  const input = document.getElementById(inputId);
  if(input) {
    input.value = opt.dataset.val;
    input.dispatchEvent(new Event('input', {bubbles:true}));
  }
  document.querySelectorAll('.cb-dropdown').forEach(d => d.style.display='none');
}

function collectConfirmations() {
  const result = {};
  document.querySelectorAll('[data-cf]').forEach(el => {
    const path = el.dataset.cf;
    if(path === '_colors') return; // 跳过颜色组标记
    const val = el.value;
    const parts = path.split('.');
    let obj = result;
    for(let i=0;i<parts.length-1;i++) {
      if(!obj[parts[i]]) obj[parts[i]] = {};
      obj = obj[parts[i]];
    }
    const last = parts[parts.length-1];
    obj[last] = val==='' ? val : (isNaN(val) ? val : Number(val));
  });
  // 合并 style_objective.mode + style_objective.style → style_objective
  const so = result.style_objective || {};
  const mode = so.mode || '';
  const style = so.style || '';
  if(mode || style) {
    result.style_objective = (mode && style) ? mode + ' — ' + style : (mode || style);
  } else {
    delete result.style_objective;
  }
  return result;
}

// ── 渲染 Page Plan ──
function renderPagePlan(pages) {
  if(!pages) pages=[];
  document.getElementById('pageCount').textContent = pages.length;
  const list = document.getElementById('pageList');
  list.innerHTML = '';
  pages.forEach((p,i) => {
    const hint = p.layout_hint||'content';
    const label = hint==='cover'?'封面': (hint==='end'||hint==='ending'?'结束':'内容');
    let title = p.title||('第'+(i+1)+'页');
    // 清理 JSON 残片标题
    if(title.startsWith('{') || title.startsWith('"')) title = '第'+(i+1)+'页';
    let fname = p.filename||'';
    if(fname.startsWith('{') || fname.startsWith('"')) fname = '';
    list.innerHTML += `<div class="page-item"><div class="page-num">${i+1}</div><div class="page-info"><div class="page-title">${escHtml(title)}</div><div class="page-hint">${label}${fname?' · '+escHtml(fname):''}</div></div></div>`;
  });
}

// ── 页数调整时调用LLM重新规划 ──
let _replanTimer = null;
let _originalPageCount = null; // 记录初始推荐页数
function adjustPagePlan() {
  if(!previewData || !currentTaskId) return;
  const el = document.querySelector('[data-cf="page_count.recommended"]');
  if(!el) return;
  const targetCount = Math.max(3, Math.min(30, parseInt(el.value)||8));

  // 如果页数没变，不触发replan
  if(_originalPageCount === null) _originalPageCount = targetCount;
  if(targetCount === _originalPageCount) {
    document.getElementById('pageList').style.opacity = '1';
    return;
  }

  // 先立即更新显示页数
  document.getElementById('pageCount').textContent = targetCount;

  // 防抖: 800ms内不再修改才发请求
  if(_replanTimer) clearTimeout(_replanTimer);
  const list = document.getElementById('pageList');
  list.style.opacity = '0.5';
  list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--dim)">⏳ AI 正在重新规划...</div>';

  _replanTimer = setTimeout(async () => {
    try {
      const r = await fetch('/api/generate/replan', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          task_id: currentTaskId,
          target_pages: targetCount,
          enable_thinking: thinkingPref
        })
      });
      if(!r.ok) { const e = await r.json(); throw new Error(e.detail||'重新规划失败'); }
      const data = await r.json();
      if(data.page_plan && data.page_plan.length > 0) {
        previewData.page_plan = data.page_plan;
        renderPagePlan(data.page_plan);
      } else {
        // LLM返回空，回退到前端简单调整
        fallbackAdjust(targetCount);
      }
    } catch(e) {
      console.error('replan失败:', e);
      fallbackAdjust(targetCount);
    }
    list.style.opacity = '1';
  }, 800);
}

// 回退: 前端机械增删 (仅LLM不可用时)
function fallbackAdjust(targetCount) {
  const pages = previewData.page_plan || [];
  if(targetCount > pages.length) {
    const pad = (n) => String(n).padStart(2,'0');
    while(pages.length < targetCount) {
      const lastIsEnd = pages.length > 0 && /^end/.test(pages[pages.length-1].layout_hint||'');
      const newPage = {
        page_num: pages.length+1,
        title: '内容页 ' + pages.length,
        filename: 'slide_' + pad(pages.length+1) + '_content.svg',
        layout_hint: 'content',
        key_points: '待AI规划'
      };
      if(lastIsEnd) { pages.splice(pages.length-1, 0, newPage); }
      else { pages.push(newPage); }
      pages.forEach((p,i) => { p.page_num = i+1; });
    }
  } else {
    while(pages.length > targetCount) {
      const last = pages[pages.length-1];
      if(pages.length > 2 && /^end/.test(last.layout_hint||'')) { pages.splice(pages.length-2, 1); }
      else { pages.pop(); }
    }
    pages.forEach((p,i) => { p.page_num = i+1; });
  }
  previewData.page_plan = pages;
  renderPagePlan(pages);
}

// ── 确认并执行 ──
async function confirmAndExecute() {
  if(!currentTaskId||!previewData) return;
  const confirmations = collectConfirmations();

  showPhase('progress');
  document.getElementById('progressTitle').textContent='⏳ Step 5-7: 正在生成PPT...';
  updateProgressUI({progress:25,stage:'step5',message:'准备中...'});

  try {
    const r = await fetch('/api/generate/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      task_id:currentTaskId, confirmations:confirmations, spec_lock:null, enable_thinking:thinkingPref
    })});
    if(!r.ok){const e=await r.json();throw new Error(e.detail||'确认失败');}
    pollUntil(currentTaskId,'done', onExecuteDone, onError);
  } catch(e) { showError(e.message); }
}

function onExecuteDone(task) {
  document.getElementById('downloadBtn').href='/api/download/'+task.id;
  document.getElementById('previewLink').href='/api/preview/'+task.id;
  showPhase('done');
}

function onError(task) { showError(task.message); }

// ── 轮询 ──
function pollUntil(taskId, target, onDone, onErr) {
  const iv = setInterval(async () => {
    try {
      const r = await fetch('/api/tasks/'+taskId);
      const t = await r.json();
      updateProgressUI(t);
      if(t.status===target) { clearInterval(iv); onDone(t); }
      else if(t.status==='error') { clearInterval(iv); onErr(t); }
    } catch(e) {}
  }, 1500);
}

function updateProgressUI(t) {
  const p = t.progress||0;
  document.getElementById('progressFill').style.width = p+'%';
  document.getElementById('progressPct').textContent = p+'%';
  document.getElementById('progressStage').textContent = (t.stage||'').replace(/_/g,' ').toUpperCase();
  document.getElementById('progressMsg').textContent = t.message||'';
}

// ── WebSocket ──
function connectWS(taskId) {
  try {
    const proto = location.protocol==='https:'?'wss':'ws';
    const ws = new WebSocket(proto+'://'+location.host+'/ws/tasks/'+taskId);
    ws.onmessage = e => { try{const d=JSON.parse(e.data);updateProgressUI(d);}catch(err){} };
  } catch(e) {}
}

function showError(msg) { document.getElementById('errorMsg').textContent=msg; showPhase('error'); }
</script>
